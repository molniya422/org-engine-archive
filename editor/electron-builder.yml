appId: com.orgengine.editor
productName: Org Engine Editor
copyright: Copyright 2026

directories:
  output: release
  buildResources: electron

files:
  - electron/dist/**/*
  - backend-server/bundle/**/*
  - frontend/dist/**/*

extraResources:
  - from: dist/orchestrator-adapter.exe
    to: harness/orchestrator-adapter.exe
  - from: schema/
    to: schema/

win:
  target: nsis
  sign: null

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # P9.1 — 卸载/升级永不删除用户数据目录（personal.sqlite、evidence）。
  # 用户数据在 %APPDATA%/<userData>，不在安装目录，也不在 asar。
  deleteAppDataOnUninstall: false
